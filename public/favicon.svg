<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Barcode Generator</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <!-- guard bars -->
  <rect x="14" y="14" width="3" height="36" fill="#ffffff"/>
  <rect x="46" y="14" width="4" height="36" fill="#ffffff"/>
  <!-- data bars -->
  <rect x="19" y="17" width="6" height="30" fill="#ffffff"/>
  <rect x="28" y="17" width="3" height="30" fill="#ffffff"/>
  <rect x="33" y="17" width="5" height="30" fill="#ffffff"/>
  <rect x="41" y="17" width="3" height="30" fill="#ffffff"/>
  <!-- laser scan line -->
  <rect x="10" y="29" width="44" height="4" rx="2" fill="#ef4444"/>
</svg>
